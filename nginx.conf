# Nginx serves the Vite build and forwards browser API traffic to the Docker
# service name for the API gateway. Keep these upstream names aligned with
# docker-compose.prod.yml.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lightweight container health endpoint used by Docker health checks.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # React Router fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Public API and OAuth callbacks go through the gateway inside the Docker network.
    location ~ ^/(api|oauth2|login)/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
